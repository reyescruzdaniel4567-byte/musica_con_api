{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Editar Instrumento</title>
    <link rel="stylesheet" href="{% static 'bases1/css/estilos.css' %}">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Editar Instrumento: {{ instrumento.nombre_del_instrumento }}</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Nombre del Instrumento</label>
                <input type="text" name="nombre_del_instrumento" value="{{ instrumento.nombre_del_instrumento }}" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Familia / Tipo</label>
                <input type="text" name="tipo_de_instrumento" value="{{ instrumento.tipo_de_instrumento }}" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Intérpretes Asociados (Usa Ctrl para deseleccionar/seleccionar)</label>
                <select name="musicos" class="form-control" multiple>
                    {% for m in musicos %}
                        <option value="{{ m.id }}" {% if m in instrumento.musicos.all %}selected{% endif %}>
                            {{ m.nombre }} {{ m.apellido }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea name="descripcion" class="form-control" rows="3">{{ instrumento.descripcion }}</textarea>
            </div>
            <button type="submit" class="btn btn-editar">Actualizar Instrumento</button>
            <a href="{% url 'bases1' %}" class="btn btn-cancelar">Cancelar</a>
        </form>
    </div>
</body>
</html>
